<p>Lord, let my tongue speak life, not death, since I will eat the fruit of my words.</p>`},{title:"Proverbs - Chapter 19",html:`<p>Solomon reflects on integrity over foolish wealth, God's ultimate sovereignty over human plans, and the importance of accepting correction and discipline.</p>
<p class="verse-ref">Proverbs 19:11</p>
<p>A person's wisdom yields patience; it is to one's glory to overlook an offense.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine wisdom produces the patience to overlook minor offenses rather than reacting to every slight.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, give me the wisdom to patiently overlook offenses rather than reacting to every slight.</p>
<p class="verse-ref">Proverbs 19:17</p>
<p>Whoever is kind to the poor lends to the LORD, and He will reward them for what they have done.</p>
<h3 class="section-label life">Life Application</h3>
<p>Kindness toward the poor is treated as a genuine investment with God Himself.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let my kindness toward the poor be a genuine investment in Your kingdom.</p>
<p class="verse-ref">Proverbs 19:21</p>
<p>Many are the plans in a person's heart, but it is the LORD's purpose that prevails.</p>
<h3 class="section-label life">Life Application</h3>
<p>Despite our many plans, God's ultimate purpose is what genuinely prevails in the end.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let Your purpose prevail over my own many competing plans.</p>`},{title:"Proverbs - Chapter 20",html:`<p>This chapter addresses the danger of excessive alcohol, laziness, dishonest business practices, and the value of a good name over material riches.</p>
<p class="verse-ref">Proverbs 20:7</p>
<p>The righteous lead blameless lives; blessed are their children after them.</p>
<h3 class="section-label life">Life Application</h3>
<p>A parent's genuine integrity leaves a blessed legacy that extends to future generations.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let my integrity leave a blessed legacy for those who come after me.</p>
<p class="verse-ref">Proverbs 20:11</p>
<p>Even small children are known by their actions, so is their conduct really pure and upright.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine character reveals itself through actions from an early age, not merely through professed intentions.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let my actions genuinely reveal a pure and upright character.</p>
<p class="verse-ref">Proverbs 20:24</p>
<p>A person's steps are directed by the LORD, so how can anyone understand their own way.</p>
<h3 class="section-label life">Life Application</h3>
<p>Recognizing God's ultimate direction over our steps rightly humbles our confidence in fully understanding our own path.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, direct my steps, since I cannot fully understand my own way alone.</p>`},{title:"Proverbs - Chapter 21",html:`<p>Solomon emphasizes that even a king's heart is directed by God, warning against pride and laziness while celebrating righteousness and justice above mere ritual sacrifice.</p>
<p class="verse-ref">Proverbs 21:2</p>
<p>A person may think their own ways are right, but the LORD weighs the heart.</p>
<h3 class="section-label life">Life Application</h3>
<p>Our own self-assessment can be genuinely mistaken, since God alone accurately weighs the heart.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, weigh my heart accurately, since my own self-assessment can be mistaken.</p>
<p class="verse-ref">Proverbs 21:3</p>
<p>To do what is right and just is more acceptable to the LORD than sacrifice.</p>
<h3 class="section-label life">Life Application</h3>
<p>Practical righteousness and justice matter more to God than merely religious ritual or performance.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let practical righteousness and justice mark my life more than mere religious ritual.</p>
<p class="verse-ref">Proverbs 21:23</p>
<p>Those who guard their mouths and their tongues keep themselves from calamity.</p>
<h3 class="section-label life">Life Application</h3>
<p>Careful restraint in speech genuinely protects us from many avoidable calamities.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me guard my mouth and tongue, protecting myself from avoidable calamity.</p>`},{title:"Proverbs - Chapter 22",html:`<p>Solomon values a good reputation above riches, warns against exploiting the poor, and begins a section addressing wise responses to wealth, generosity, and boundaries.</p>
<p class="verse-ref">Proverbs 22:1</p>
<p>A good name is more desirable than great riches, and to be esteemed is better than silver or gold.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine character and reputation hold more lasting value than mere accumulated wealth.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let a good name before You matter more to me than great riches.</p>
<p class="verse-ref">Proverbs 22:6</p>
<p>Start children off on the way they should go, and even when they are old they will not turn from it.</p>
<h3 class="section-label life">Life Application</h3>
<p>Intentional early formation in godly ways provides a lasting foundation throughout a person's life.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me intentionally form godly foundations in those I influence and raise.</p>
<p class="verse-ref">Proverbs 22:9</p>
<p>The generous will themselves be blessed, for they share their food with the poor.</p>
<h3 class="section-label life">Life Application</h3>
<p>Generosity, particularly toward the poor, invites genuine reciprocal blessing.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, make me generous toward the poor, trusting Your blessing in return.</p>`},{title:"Proverbs - Chapter 23",html:`<p>Solomon warns against overindulgence, envy of the wicked, and neglecting discipline, while reflecting on the destructive path of excessive drinking.</p>
<p class="verse-ref">Proverbs 23:17-18</p>
<p>Do not let your heart envy sinners, but always be zealous for the fear of the LORD, since there is surely a future hope for you.</p>
<h3 class="section-label life">Life Application</h3>
<p>Zealous reverence for God provides a healthier focus than envying the wicked's temporary success.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let zealous reverence for You replace any envy of the wicked's temporary success.</p>
<p class="verse-ref">Proverbs 23:23</p>
<p>Buy the truth and do not sell it; get wisdom, discipline, and understanding.</p>
<h3 class="section-label life">Life Application</h3>
<p>Truth and wisdom are worth costly investment and should never be casually traded away.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me invest costly effort in truth and wisdom, never trading them away.</p>`},{title:"Proverbs - Chapter 24",html:`<p>Solomon encourages diligent building of wisdom-filled households, warns against envying evildoers, and closes this section with a vivid picture of a lazy person's neglected field.</p>
<p class="verse-ref">Proverbs 24:3-4</p>
<p>By wisdom a house is built, and through understanding it is established; through knowledge its rooms are filled with rare and beautiful treasures.</p>
<h3 class="section-label life">Life Application</h3>
<p>Wisdom and understanding provide the genuine foundation for building a flourishing household.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let wisdom and understanding build and establish my household well.</p>
<p class="verse-ref">Proverbs 24:16</p>
<p>The righteous may fall seven times, but they rise again, but the wicked stumble when calamity strikes.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine righteousness includes resilience to rise again after repeated falls, not mere sinlessness.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, give me resilience to rise again after every fall, reflecting genuine righteousness.</p>
<p class="verse-ref">Proverbs 24:30-31</p>
<p>Solomon passed by the field of a sluggard, and it was overgrown with thorns, its stone wall in ruins.</p>
<h3 class="section-label life">Life Application</h3>
<p>Neglect, even without dramatic wrongdoing, produces genuine ruin over time through simple inattention.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, keep me from the ruin that comes through simple neglect and inattention.</p>`},{title:"Proverbs - Chapter 25",html:`<p>This section, copied by Hezekiah's officials, offers proverbs on humility before kings, restraint in conflict, and the value of well-timed, appropriate words.</p>
<p class="verse-ref">Proverbs 25:11</p>
<p>A word fitly spoken is like apples of gold set in silver.</p>
<h3 class="section-label life">Life Application</h3>
<p>Well-timed, appropriate words carry genuine beauty and value beyond their literal content.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me speak fitting words, well-timed and genuinely valuable to those who hear them.</p>
<p class="verse-ref">Proverbs 25:21-22</p>
<p>If your enemy is hungry, give them food to eat, and if thirsty, give them water to drink; in doing this you will heap burning coals on their head.</p>
<h3 class="section-label life">Life Application</h3>
<p>Responding to enemies with kindness rather than retaliation reflects a genuinely counter-cultural wisdom.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me respond to my enemies with kindness rather than retaliation.</p>
<p class="verse-ref">Proverbs 25:28</p>
<p>Like a city whose walls are broken through is a person who lacks self-control.</p>
<h3 class="section-label life">Life Application</h3>
<p>Self-control functions as a protective wall, and its absence leaves us genuinely vulnerable.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, strengthen my self-control, protecting me like a well-guarded wall.</p>`},{title:"Proverbs - Chapter 26",html:`<p>Solomon offers vivid, memorable warnings against honouring fools, the danger of laziness, and the destructive nature of gossip and quarreling.</p>
<p class="verse-ref">Proverbs 26:12</p>
<p>Do you see a person wise in their own eyes? There is more hope for a fool than for them.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine self-awareness of our limitations proves more valuable than confident but misplaced self-assurance.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, keep me from being wise in my own eyes, genuinely aware of my limitations.</p>
<p class="verse-ref">Proverbs 26:20</p>
<p>Without wood a fire goes out; without a gossip a quarrel dies down.</p>
<h3 class="section-label life">Life Application</h3>
<p>Refusing to feed gossip or contribute additional fuel can genuinely defuse ongoing conflict.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me refuse to feed gossip or contribute fuel to ongoing conflict.</p>`},{title:"Proverbs - Chapter 27",html:`<p>This chapter reflects on the value of genuine friendship, honest correction, and diligent stewardship of what has been entrusted to us.</p>
<p class="verse-ref">Proverbs 27:6</p>
<p>Wounds from a friend can be trusted, but an enemy multiplies kisses.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine friendship includes trustworthy honesty, even when it hurts, over flattering but hollow praise.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, give me friends whose honest wounds I can trust, over enemies with hollow flattery.</p>
<p class="verse-ref">Proverbs 27:17</p>
<p>As iron sharpens iron, so one person sharpens another.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine relationships should sharpen and improve both people involved, not merely comfort them.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let my relationships genuinely sharpen both myself and those around me.</p>
<p class="verse-ref">Proverbs 27:23</p>
<p>Be sure you know the condition of your flocks, give careful attention to your herds.</p>
<h3 class="section-label life">Life Application</h3>
<p>Diligent, attentive stewardship of what's entrusted to us reflects genuine wisdom and responsibility.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me give careful, diligent attention to everything You've entrusted to my care.</p>`},{title:"Proverbs - Chapter 28",html:`<p>Solomon contrasts the confidence of the righteous with the fearful flight of the wicked, warning against oppressing the poor while celebrating honest confession over concealed sin.</p>
<p class="verse-ref">Proverbs 28:1</p>
<p>The wicked flee though no one pursues, but the righteous are as bold as a lion.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine righteousness produces a bold confidence that guilty conscience and wickedness cannot sustain.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let righteousness produce genuine boldness in me, like a confident lion.</p>
<p class="verse-ref">Proverbs 28:13</p>
<p>Whoever conceals their sins does not prosper, but the one who confesses and renounces them finds mercy.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine mercy and prosperity flow from honest confession, not from concealing our sin.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me confess and renounce my sin honestly, trusting Your mercy in return.</p>
<p class="verse-ref">Proverbs 28:27</p>
<p>Those who give to the poor will lack nothing, but those who close their eyes to them receive many curses.</p>
<h3 class="section-label life">Life Application</h3>
<p>Generosity toward the poor is genuinely connected to God's provision, while indifference invites real consequence.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let generosity toward the poor mark my life, rather than indifference.</p>`},{title:"Proverbs - Chapter 29",html:`<p>This chapter reflects on the impact of righteous versus wicked leadership on a nation, the value of discipline, and the freedom found in trusting God over fearing others.</p>
<p class="verse-ref">Proverbs 29:18</p>
<p>Where there is no revelation, people cast off restraint, but blessed is the one who heeds wisdom's instruction.</p>
<h3 class="section-label life">Life Application</h3>
<p>A community without genuine vision and revelation from God tends toward moral chaos and lost restraint.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, provide vision and revelation that keeps me grounded in wisdom's instruction.</p>
<p class="verse-ref">Proverbs 29:23</p>
<p>Pride brings a person low, but the lowly in spirit gain honour.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine humility, counterintuitively, leads toward true honour, while pride leads toward being brought low.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let humility, not pride, be the path I walk toward genuine honour.</p>
<p class="verse-ref">Proverbs 29:25</p>
<p>Fear of man will prove to be a snare, but whoever trusts in the LORD is kept safe.</p>
<h3 class="section-label life">Life Application</h3>
<p>Fearing people's opinions or reactions can genuinely trap us, while trust in God provides real safety.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, free me from the snare of fearing others; let my trust rest safely in You.</p>`},{title:"Proverbs - Chapter 30",html:`<p>Agur reflects humbly on the limits of human understanding, prays for neither poverty nor riches but honest daily provision, and observes patterns in nature that illustrate wisdom.</p>
<p class="verse-ref">Proverbs 30:5</p>
<p>Every word of God is flawless; He is a shield to those who take refuge in Him.</p>
<h3 class="section-label life">Life Application</h3>
<p>Confidence in the flawless reliability of God's word provides genuine refuge and protection.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, thank You for Your flawless word, a genuine shield for those who take refuge in You.</p>
<p class="verse-ref">Proverbs 30:8-9</p>
<p>Agur asked to be given neither poverty nor riches, but only his daily bread, lest he have too much and disown the LORD, or too little and steal.</p>
<h3 class="section-label life">Life Application</h3>
<p>Contentment with sufficient provision, rather than extremes of poverty or wealth, guards against particular spiritual dangers.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, grant me contentment with sufficient daily provision, guarding my heart from both extremes.</p>`},{title:"Proverbs - Chapter 31",html:`<p>The book closes with King Lemuel's mother's instruction against destructive living, and the famous acrostic poem celebrating the industrious, wise, and God-fearing woman of noble character.</p>
<p class="verse-ref">Proverbs 31:8-9</p>
<p>Lemuel's mother urged him to speak up for those who cannot speak for themselves, to defend the rights of the poor and needy.</p>
<h3 class="section-label life">Life Application</h3>
<p>Using our voice and position to advocate for the voiceless reflects genuine godly leadership.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me use my voice to defend the rights of the poor and needy.</p>
<p class="verse-ref">Proverbs 31:25</p>
<p>The woman of noble character is clothed with strength and dignity, and she can laugh at the days to come.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine inner strength and dignity provide confidence to face an uncertain future without fear.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, clothe me with strength and dignity, so I can face the future without fear.</p>
<p class="verse-ref">Proverbs 31:30</p>
<p>Charm is deceptive and beauty is fleeting, but a woman who fears the LORD is to be praised.</p>
<h3 class="section-label life">Life Application</h3>
<p>Reverent fear of God provides a lasting basis for praise that surpasses temporary charm or beauty.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let reverent fear of You, not fleeting charm or beauty, be the basis of my genuine worth.</p>
<p>PART FOUR</p>`},{title:"Ecclesiastes - Introduction",html:`<h3 class="section-label">Book Summary</h3>
<p>Ecclesiastes records the reflections of 'the Teacher,' traditionally understood as Solomon in his later years, as he examines life 'under the sun' and repeatedly concludes that everything pursued apart from God is fleeting, like chasing after wind. The Teacher systematically tests every possible source of meaning, pleasure, wisdom, wealth, achievement, and work, finding each ultimately insufficient to provide lasting satisfaction or answer death's inevitability. Rather than descending into pure despair, the book's honest wrestling with life's apparent meaninglessness ultimately points toward its most stable conclusion: enjoying the simple gifts of daily life as gifts from God's hand, while fearing God and keeping His commandments, since this is the whole duty of humanity. Ecclesiastes stands as Scripture's most philosophically honest book, refusing easy answers while still landing on genuine, grounded hope.</p>
<h3 class="section-label">Key Life Applications</h3>
<p class="key-point">1. Nothing 'Under the Sun' Fully Satisfies – The Teacher tested pleasure, wealth, wisdom, and achievement, finding each ultimately insufficient. Application: Resist placing ultimate hope in achievements, pleasure, or wealth alone.</p>
<p class="key-point">2. There Is a Time for Everything – Ecclesiastes 3 famously describes life's seasons, each with its appointed time. Application: Accept the season you're currently in, trusting God's timing over your own preferences.</p>
<p class="key-point">3. Enjoy Life's Simple Gifts – Despite its honest pessimism, the book repeatedly commends enjoying food, work, and relationships as gifts from God. Application: Practice gratitude for life's ordinary, simple pleasures as gifts from God's hand.</p>
<p class="key-point">4. Fear God and Keep His Commands – The book's final conclusion cuts through all its searching with this simple call. Application: Let reverence for God and obedience to Him anchor your life, regardless of what remains philosophically unresolved.</p>`},{title:"Ecclesiastes - Chapter 1",html:`<p>The Teacher opens with his famous refrain that everything is fleeting and meaningless, describing the endless, repetitive cycles of nature and the exhausting pursuit of wisdom that ultimately increases sorrow.</p>
<p class="verse-ref">Ecclesiastes 1:2</p>
<p>The Teacher declared that everything is fleeting and temporary, utterly fleeting, everything is fleeting.</p>
<h3 class="section-label life">Life Application</h3>
<p>Honest acknowledgment of life's fleeting nature can be the necessary starting point for finding what truly lasts.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me honestly acknowledge what is fleeting, so I can pursue what truly lasts.</p>
<p class="verse-ref">Ecclesiastes 1:9</p>
<p>The Teacher observed that what has been will be again, what has been done will be done again; there is nothing new under the sun.</p>
<h3 class="section-label life">Life Application</h3>
<p>Recognizing life's repetitive patterns can produce either despair or a grounded realism about human limitation.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, give me grounded realism about life's patterns, without falling into despair.</p>
<p class="verse-ref">Ecclesiastes 1:18</p>
<p>The Teacher observed that with much wisdom comes much sorrow; the more knowledge, the more grief.</p>
<h3 class="section-label life">Life Application</h3>
<p>Increased understanding, while valuable, often comes paired with a deeper awareness of life's genuine difficulties.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me carry the grief that sometimes accompanies wisdom with grace, not bitterness.</p>`},{title:"Ecclesiastes - Chapter 2",html:`<p>The Teacher conducts an extensive experiment testing pleasure, great building projects, and accumulated wealth, ultimately concluding that even the wise face the same fate as fools: death.</p>
<p class="verse-ref">Ecclesiastes 2:10-11</p>
<p>The Teacher denied himself nothing his eyes desired, yet when he surveyed all his hands had done, everything was fleeting, a chasing after the wind, with nothing gained under the sun.</p>
<h3 class="section-label life">Life Application</h3>
<p>Even unrestrained pursuit of every pleasure ultimately fails to produce lasting, genuine satisfaction.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, keep me from believing unrestrained pleasure alone can produce lasting satisfaction.</p>
<p class="verse-ref">Ecclesiastes 2:24</p>
<p>The Teacher concluded that there is nothing better for a person than to eat and drink and find satisfaction in their own work, recognizing this too is from the hand of God.</p>
<h3 class="section-label life">Life Application</h3>
<p>Simple, ordinary satisfaction in daily food and work is itself a genuine gift from God, worth recognizing as such.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me recognize and enjoy the simple gifts of daily food and work as coming from Your hand.</p>`},{title:"Ecclesiastes - Chapter 3",html:`<p>In one of Scripture's most famous passages, the Teacher describes life's rhythm of appointed seasons, before reflecting on humanity's inability to fully grasp eternity or escape shared mortality with the animals.</p>
<p class="verse-ref">Ecclesiastes 3:1</p>
<p>The Teacher declared there is a time for everything, and a season for every activity under the heavens.</p>
<h3 class="section-label life">Life Application</h3>
<p>Recognizing life's appointed seasons helps us accept the present moment rather than resist its particular demands.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me accept the season I'm currently in, trusting Your appointed timing.</p>
<p class="verse-ref">Ecclesiastes 3:11</p>
<p>The Teacher declared that God has made everything beautiful in its time, and has also set eternity in the human heart, yet no one can fathom what God has done from beginning to end.</p>
<h3 class="section-label life">Life Application</h3>
<p>Our deep, innate longing for eternity reflects genuine spiritual reality, even though full understanding remains beyond us.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, thank You for placing eternity in my heart, even though I cannot fully understand Your ways.</p>
<p class="verse-ref">Ecclesiastes 3:14</p>
<p>The Teacher declared that everything God does will endure forever, nothing can be added to it or taken from it, and God does it so that people will revere Him.</p>
<h3 class="section-label life">Life Application</h3>
<p>God's unchanging, enduring work is specifically designed to produce genuine reverence in those who observe it.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let Your enduring, unchanging work produce genuine reverence in my heart.</p>`},{title:"Ecclesiastes - Chapter 4",html:`<p>The Teacher observes the pain of oppression, the loneliness of isolated toil, and the genuine value of companionship, before noting the fleeting nature of popularity and political power.</p>
<p class="verse-ref">Ecclesiastes 4:9-10</p>
<p>The Teacher observed that two are better than one, since they have a good return for their labour, and if either falls, the other can help them up.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine companionship provides practical support and mutual help that isolation cannot offer.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, provide genuine companionship in my life, and help me be that support for others.</p>
<p class="verse-ref">Ecclesiastes 4:12</p>
<p>The Teacher observed that though one may be overpowered, two can defend themselves, and a cord of three strands is not quickly broken.</p>
<h3 class="section-label life">Life Application</h3>
<p>Strength multiplies through genuine partnership, particularly when God is included as the third strand.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let my relationships be strengthened as a cord of three strands, including You.</p>`},{title:"Ecclesiastes - Chapter 5",html:`<p>The Teacher offers practical wisdom about approaching worship with reverence, fulfilling vows made to God, and recognizing the emptiness of loving money without contentment.</p>
<p class="verse-ref">Ecclesiastes 5:2</p>
<p>The Teacher warned against being quick with the mouth or hasty in heart to utter anything before God, since God is in heaven and we are on earth, so let our words be few.</p>
<h3 class="section-label life">Life Application</h3>
<p>Reverence before God rightly produces careful, thoughtful speech rather than careless, hasty words.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let reverence for You produce careful, thoughtful speech in my prayers.</p>
<p class="verse-ref">Ecclesiastes 5:10</p>
<p>The Teacher observed that whoever loves money never has enough, and whoever loves wealth is never satisfied with their income.</p>
<h3 class="section-label life">Life Application</h3>
<p>The pursuit of wealth alone proves an insatiable, ultimately unsatisfying goal.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, guard my heart from the insatiable, unsatisfying pursuit of wealth alone.</p>
<p class="verse-ref">Ecclesiastes 5:19</p>
<p>The Teacher observed that when God gives someone wealth and possessions, and enables them to enjoy them, to accept their lot and be happy in their work, this is a gift from God.</p>
<h3 class="section-label life">Life Application</h3>
<p>The genuine ability to enjoy what we have, not merely possessing it, is itself recognized as a gift from God.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, thank You for the gift of being able to genuinely enjoy what You've given me.</p>`},{title:"Ecclesiastes - Chapter 6",html:`<p>The Teacher laments the tragedy of wealth without the capacity to enjoy it, reflecting further on the limitations of human desire and understanding in the face of life's brevity.</p>
<p class="verse-ref">Ecclesiastes 6:9</p>
<p>The Teacher observed that better is what the eye sees than the roving of desire, since this too is fleeting, a chasing after the wind.</p>
<h3 class="section-label life">Life Application</h3>
<p>Contentment with what is genuinely present proves wiser than endless roving desire for something more.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me find contentment in what I currently have, rather than endless roving desire.</p>`},{title:"Ecclesiastes - Chapter 7",html:`<p>The Teacher offers a series of paradoxical wisdom sayings, valuing sorrow's instructive power over mere pleasure, and cautioning against both excessive righteousness and excessive wickedness.</p>
<p class="verse-ref">Ecclesiastes 7:2</p>
<p>The Teacher declared it is better to go to a house of mourning than to a house of feasting, since death is the destiny of everyone, and the living should take this to heart.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine reflection on mortality, though uncomfortable, produces wisdom that mere celebration cannot.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let honest reflection on mortality produce genuine wisdom in how I live.</p>
<p class="verse-ref">Ecclesiastes 7:8</p>
<p>The Teacher declared that the end of a matter is better than its beginning, and patience is better than pride.</p>
<h3 class="section-label life">Life Application</h3>
<p>Patient endurance toward completion proves wiser than prideful confidence at the outset.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, give me patience to endure toward completion, rather than mere pride at the beginning.</p>`},{title:"Ecclesiastes - Chapter 8",html:`<p>The Teacher reflects on the wisdom of respecting authority, the mystery of why the wicked sometimes prosper and the righteous sometimes suffer, and the limits of fully understanding God's work.</p>
<p class="verse-ref">Ecclesiastes 8:12</p>
<p>The Teacher acknowledged that although a wicked person commits a hundred crimes and still lives long, he knew it would go better with those who fear God and revere Him.</p>
<h3 class="section-label life">Life Application</h3>
<p>Despite apparent inconsistencies in this life, confidence in ultimate blessing rests with those who genuinely fear God.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let my confidence rest in Your ultimate blessing for those who genuinely fear You.</p>
<p class="verse-ref">Ecclesiastes 8:17</p>
<p>The Teacher concluded that no one can comprehend all that God has done under the sun, and however much they labour to search it out, they will not find it.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine humility acknowledges the real limits of human understanding regarding God's complete purposes.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, give me humility to accept the genuine limits of my understanding of Your ways.</p>`},{title:"Ecclesiastes - Chapter 9",html:`<p>The Teacher observes that death comes to everyone regardless of righteousness or wickedness, urging genuine enjoyment of life's simple gifts while noting that wisdom, though valuable, is often overlooked.</p>
<p class="verse-ref">Ecclesiastes 9:7</p>
<p>The Teacher urged his readers to go and eat their food with gladness, and drink their wine with a joyful heart, since God has already approved what they do.</p>
<h3 class="section-label life">Life Application</h3>
<p>Simple, everyday enjoyment of food and life can be embraced with genuine gladness, not guilt.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me enjoy the simple gifts of daily life with genuine gladness.</p>
<p class="verse-ref">Ecclesiastes 9:10</p>
<p>The Teacher urged that whatever their hands find to do, they should do it with all their might, since there is no working or planning in the grave.</p>
<h3 class="section-label life">Life Application</h3>
<p>The brevity of life calls for wholehearted engagement in whatever work is before us right now.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me do whatever is before me with wholehearted effort, mindful of life's brevity.</p>`},{title:"Ecclesiastes - Chapter 10",html:`<p>The Teacher offers various practical wisdom sayings contrasting wise and foolish behaviour, particularly regarding leadership, speech, and diligent preparation.</p>
<p class="verse-ref">Ecclesiastes 10:1</p>
<p>The Teacher observed that as dead flies give perfume a bad smell, so a little folly outweighs wisdom and honour.</p>
<h3 class="section-label life">Life Application</h3>
<p>Even small, seemingly minor folly can significantly undermine an otherwise wise and honourable reputation.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, protect me from small foolishness that could undermine wisdom and honour in my life.</p>
<p class="verse-ref">Ecclesiastes 10:12</p>
<p>The Teacher observed that words from the mouth of the wise are gracious, but fools are consumed by their own lips.</p>
<h3 class="section-label life">Life Application</h3>
<p>The wise person's speech genuinely benefits others, while the fool's own words become their undoing.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let my words be gracious, benefiting others rather than becoming my own undoing.</p>`},{title:"Ecclesiastes - Chapter 11",html:`<p>The Teacher encourages generous, diversified investment despite uncertainty, and urges the young to enjoy their vitality while remembering they will one day answer to God.</p>
<p class="verse-ref">Ecclesiastes 11:1</p>
<p>The Teacher urged his readers to ship their grain across the sea, since after many days they would receive a return.</p>
<h3 class="section-label life">Life Application</h3>
<p>Generous, even risky, investment of our resources can yield genuine future return, despite present uncertainty.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, give me courage to invest generously, trusting You with the uncertain outcome.</p>
<p class="verse-ref">Ecclesiastes 11:9</p>
<p>The Teacher urged the young to be happy while young, following the ways of their heart, yet knowing that for all these things God would bring them into judgment.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine enjoyment of youth can coexist with sober awareness of eventual accountability before God.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let me enjoy the season I'm in, while remaining mindful of my accountability to You.</p>`},{title:"Ecclesiastes - Chapter 12",html:`<p>The Teacher closes with a poetic reflection on aging and death, urging remembrance of God from youth, before delivering the book's final, grounding conclusion.</p>
<p class="verse-ref">Ecclesiastes 12:1</p>
<p>The Teacher urged his readers to remember their Creator in the days of their youth, before the days of trouble come.</p>
<h3 class="section-label life">Life Application</h3>
<p>Establishing devotion to God early in life provides a foundation that sustains through later, harder days.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me remember and devote myself to You now, before the harder days of life arrive.</p>
<p class="verse-ref">Ecclesiastes 12:13</p>
<p>The Teacher's final conclusion, when everything had been heard, was this: fear God and keep His commandments, for this is the whole duty of humanity.</p>
<h3 class="section-label life">Life Application</h3>
<p>After exhaustive searching, the simplest, most stable conclusion is reverent fear of God and obedience to Him.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let reverent fear of You and obedience to Your commands be the foundation of my whole life.</p>
<p class="verse-ref">Ecclesiastes 12:14</p>
<p>The Teacher declared that God will bring every deed into judgment, including every hidden thing, whether good or evil.</p>
<h3 class="section-label life">Life Application</h3>
<p>The certainty of God's final judgment provides sobering accountability for even our hidden actions.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let awareness of Your final judgment shape how I live, even in what remains hidden from others.</p>
<p>PART FIVE</p>`},{title:"Song of Solomon - Introduction",html:`<h3 class="section-label">Book Summary</h3>
<p>Song of Solomon is a lyrical love poem celebrating the beauty, longing, and joy of romantic love between a bride and groom, traditionally read as depicting Solomon and his beloved. Structured as an extended dialogue exchanged between the two lovers, with occasional commentary from a chorus of friends, the book unashamedly celebrates the goodness of romantic and marital love as part of God's good design, without ever mentioning God's name directly. Throughout history, the book has also been read allegorically, picturing the passionate love between God and His people, or between Christ and the Church, though its plainest reading remains a celebration of committed love between husband and wife. Song of Solomon offers a needed biblical counterbalance to views that treat romantic and physical love as merely utilitarian or shameful, instead portraying it as a beautiful, God-given gift meant to be treasured, pursued, and enjoyed within the bounds of committed covenant relationship.</p>
<h3 class="section-label">Key Life Applications</h3>
<p class="key-point">1. Romantic Love Is a Good Gift – The book unashamedly celebrates the beauty of love between husband and wife. Application: Treasure and nurture romantic love within marriage as a genuine gift from God.</p>
<p class="key-point">2. Love Deserves Pursuit and Delight – Both lovers actively express admiration and longing for one another throughout the book. Application: Actively express admiration and delight toward your spouse, not merely assume affection.</p>
<p class="key-point">3. Love Requires Patience and Right Timing – The repeated refrain warns against arousing love before its proper time. Application: Respect appropriate boundaries and timing in romantic relationships.</p>
<p class="key-point">4. Committed Love Is Strong and Enduring – The book compares genuine love to a seal on the heart, stronger than death itself. Application: Cultivate a love marked by lasting commitment, not merely fleeting emotion.</p>`},{title:"Song of Solomon - Chapter 1",html:`<p>The bride opens the poem expressing longing for her beloved's affection, and the two exchange tender words of mutual admiration as their love story begins.</p>
<p class="verse-ref">Song of Solomon 1:2</p>
<p>The bride longed for her beloved's kisses, since his love was more delightful than wine.</p>
<h3 class="section-label life">Life Application</h3>
<p>Openly expressing romantic longing and desire reflects the honest, God-given nature of marital love.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, thank You for the gift of romantic love, and help me express it honestly within my own relationship.</p>
<p class="verse-ref">Song of Solomon 1:15</p>
<p>The groom told his beloved how beautiful she was, praising her eyes, comparing them to doves.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine, specific admiration spoken aloud strengthens the bond between committed partners.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me speak genuine, specific admiration to those I love.</p>
<p class="verse-ref">Song of Solomon 1:16</p>
<p>The bride replied that her beloved was handsome, delightful, and that their bed was verdant like a lush forest.</p>
<h3 class="section-label life">Life Application</h3>
<p>Mutual, reciprocated affection reflects the beautiful, shared nature of genuine romantic love.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, cultivate mutual, reciprocated affection within my closest relationships.</p>`},{title:"Song of Solomon - Chapter 2",html:`<p>The lovers continue their poetic exchange comparing each other to flowers and trees amid spring's arrival, while the bride warns against awakening love prematurely.</p>
<p class="verse-ref">Song of Solomon 2:3</p>
<p>The bride compared her beloved among other young men to an apple tree among the trees of the forest, delighting to sit in his shade.</p>
<h3 class="section-label life">Life Application</h3>
<p>Finding genuine delight and rest in a committed relationship reflects the goodness of that bond.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let me find genuine delight and rest in the relationships You've given me.</p>
<p class="verse-ref">Song of Solomon 2:7</p>
<p>The bride urged her friends not to arouse or awaken love before its proper time.</p>
<h3 class="section-label life">Life Application</h3>
<p>Respecting appropriate timing and boundaries in romantic love reflects wisdom rather than impatience.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, give me wisdom to respect appropriate timing and boundaries in matters of the heart.</p>
<p class="verse-ref">Song of Solomon 2:16</p>
<p>The bride declared that her beloved was hers and she was his.</p>
<h3 class="section-label life">Life Application</h3>
<p>Mutual belonging and committed exclusivity form the foundation of genuine covenant love.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let mutual belonging and committed exclusivity mark my closest relationships.</p>`},{title:"Song of Solomon - Chapter 3",html:`<p>The bride recounts a dream of anxiously searching for her beloved through the city streets before finally finding him, followed by a description of Solomon's grand wedding procession.</p>
<p class="verse-ref">Song of Solomon 3:1-2</p>
<p>The bride recounted searching for the one her heart loved through the city streets, but not finding him until she looked further.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine, persistent longing for connection reflects the depth of committed love, even through anxious searching.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let persistent longing for genuine connection mark my most important relationships.</p>
<p class="verse-ref">Song of Solomon 3:4</p>
<p>The bride found the one her heart loved, held onto him, and would not let him go.</p>
<h3 class="section-label life">Life Application</h3>
<p>Finding and holding fast to genuine love, once discovered, reflects committed devotion.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me hold fast to genuine love and commitment once I have found it.</p>`},{title:"Song of Solomon - Chapter 4",html:`<p>The groom offers an extended, admiring description of his bride's beauty, celebrating her as uniquely captivating and inviting her into full, committed intimacy.</p>
<p class="verse-ref">Song of Solomon 4:7</p>
<p>The groom declared his darling was altogether beautiful, with no flaw in her.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine love sees and celebrates the beloved with an admiring, generous perspective.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me see those I love with an admiring, generous perspective.</p>
<p class="verse-ref">Song of Solomon 4:9</p>
<p>The groom declared his heart had been captivated by his bride with just one glance.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine romantic love can be described as deeply captivating, engaging the whole heart.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, thank You for the depth of genuine love that captivates the whole heart.</p>
<p class="verse-ref">Song of Solomon 4:16</p>
<p>The bride invited her beloved into their shared garden to taste its choice fruits.</p>
<h3 class="section-label life">Life Application</h3>
<p>Committed love includes a mutual, willing invitation into full intimacy within the marriage bond.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, bless the mutual intimacy within committed marriage as the good gift You designed it to be.</p>`},{title:"Song of Solomon - Chapter 5",html:`<p>The bride recounts a distressing dream of missing her beloved's visit and searching for him again, offering an admiring description of his appearance to her friends.</p>
<p class="verse-ref">Song of Solomon 5:2</p>
<p>The bride recounted lying awake while her heart was alert, hearing her beloved knocking at the door.</p>
<h3 class="section-label life">Life Application</h3>
<p>Relationships require attentiveness and responsiveness, even when timing feels inconvenient.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, keep my heart attentive and responsive to those I love.</p>
<p class="verse-ref">Song of Solomon 5:10</p>
<p>The bride described her beloved as radiant and ruddy, outstanding among ten thousand.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine admiration delights in describing and celebrating the unique qualities of the beloved.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let me delight in and celebrate the unique qualities of those I love.</p>
<p class="verse-ref">Song of Solomon 5:16</p>
<p>The bride declared her beloved was altogether lovely, and this was her beloved, her friend.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine romantic love includes deep friendship, not merely physical attraction alone.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let friendship deepen and undergird the romantic love in my closest relationship.</p>`},{title:"Song of Solomon - Chapter 6",html:`<p>The groom reaffirms his exclusive delight in his bride, comparing her beauty to majestic and striking imagery, and celebrating the mutual devotion between them.</p>
<p class="verse-ref">Song of Solomon 6:3</p>
<p>The bride declared she belonged to her beloved, and her beloved belonged to her.</p>
<h3 class="section-label life">Life Application</h3>
<p>Mutual, exclusive belonging remains a defining, repeated theme of genuine covenant love.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let mutual, exclusive belonging define my most committed relationship.</p>`},{title:"Song of Solomon - Chapter 7",html:`<p>The groom continues his admiring description of his bride's beauty, and she responds with an eager invitation for them to enjoy their love together in the countryside.</p>
<p class="verse-ref">Song of Solomon 7:10</p>
<p>The bride declared she belonged to her beloved, and his desire was for her.</p>
<h3 class="section-label life">Life Application</h3>
<p>Being genuinely desired by one's beloved is celebrated as a source of confidence and joy.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, thank You for the joy and confidence found in being genuinely desired and loved.</p>`},{title:"Song of Solomon - Chapter 8",html:`<p>The Song closes with the bride's powerful declaration of love's enduring strength, comparing it to a seal upon the heart, unquenchable and more powerful than death itself.</p>
<p class="verse-ref">Song of Solomon 8:6</p>
<p>The bride asked to be placed like a seal over her beloved's heart, since love is as strong as death, its jealousy unyielding as the grave.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine love is described with the strongest possible imagery, as an enduring, permanent seal upon the heart.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, let my love for those closest to me be as enduring and strong as this seal upon the heart.</p>
<p class="verse-ref">Song of Solomon 8:7</p>
<p>The bride declared that many waters cannot quench love, nor can rivers wash it away, and if a man offered all his wealth for love, it would be utterly scorned.</p>
<h3 class="section-label life">Life Application</h3>
<p>Genuine love proves resilient against overwhelming obstacles and cannot be purchased through mere wealth.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let genuine love, resilient and priceless, mark my closest relationships.</p>`}];var Kc=je(zn(),1),xm=Symbol.for("react.element");var Nm=Object.prototype.hasOwnProperty,Mm=Kc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Um={key:!0,ref:!0,__self:!0,__source:!0};function Xc(e,n,t){var r,i={},s=null,a=null;t!==void 0&&(s=""+t),n.key!==void 0&&(s=""+n.key),n.ref!==void 0&&(a=n.ref);for(r in n)Nm.call(n,r)&&!Um.hasOwnProperty(r)&&(i[r]=n[r]);if(e&&e.defaultProps)for(r in n=e.defaultProps,n)i[r]===void 0&&(i[r]=n[r]);return{$$typeof:xm,type:e,key:s,ref:a,props:i,_owner:Mm.current}}var m=Xc,P=Xc;var Zc=(e)=>e?e.replace(/\\/g,""):"",se=Qc.map((e)=>({title:Zc(e.title),html:Zc(e.html)})),qo=["Beginnings","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon"],jc="tambou_reader_job_song_lastChapter",ed="tambou_reader_job_song_progress",nd="tambou_reader_job_song_voicesettings";function Wm(e){if(["Cover","Dedication","About This Book","Preface"].includes(e))return"Beginnings";let t=e.indexOf(" - ");if(t>-1)return e.slice(0,t).trim();return"Beginnings"}function Bm(e){if(typeof document<"u"){let n=document.createElement("div");return n.innerHTML=e,(n.textContent||n.innerText||"").replace(/\s+/g," ").trim()}return e.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim()}function Qo(){let[e,n]=O.useState("sepia"),[t,r]=O.useState(18),[i,s]=O.useState(""),[a,o]=O.useState(!1),[l,h]=O.useState(!1),[g,y]=O.useState(0),[f,L]=O.useState(0),[G,D]=O.useState(!1),[I,c]=O.useState(0),[p,d]=O.useState(new Set),[b,S]=O.useState(new Set),[T,E]=O.useState(new Set(["26-50","51-75","76-100","101-125","126-150"])),[Y,Q]=O.useState(null),[H,Ge]=O.useState(""),[Fn,Ko]=O.useState([]),[Xo,vs]=O.useState(!1),[Zo,nt]=O.useState(!1),[Ur,jo]=O.useState(1),[Wr,id]=O.useState([]),[Br,el]=O.useState(""),[tt,sd]=O.useState([]),[Ot,ws]=O.useState(0),[nl,ad]=O.useState(!0),Vr=O.useRef(!1),Be=O.useRef(null),bs=O.useRef(null),On=O.useMemo(()=>se.map((u)=>Bm(u.html)),[]),ks=O.useMe         :root { --base-font: 18px; }
        [data-theme="light"] {
          --bg: #FEFCF9;
          --bg-soft: #FFFEFB;
          --text: #1C1917;
          --text-muted: #78716C;
          --text-faint: #A8A29E;
          --border: #F5F0E8;
          --border-strong: #E7DCC8;
          --accent: #7A1F2D;
          --accent-soft: #F9E4E7;
          --card: #FFFFFF;
          --card-hover: #FFF6F6;
          --hl: #F9E4E7;
          --tts-bg: #FFF5F6;
          --paper: radial-gradient(ellipse at top, rgba(122,31,45,0.07), transparent 60%), radial-gradient(ellipse at bottom, rgba(122,31,45,0.04), transparent 70%);
        }
        [data-theme="sepia"] {
          --bg: #F6F1E7;
          --bg-soft: #FAF6EE;
          --text: #433422;
          --text-muted: #8B7355;
          --text-faint: #A89078;
          --border: #E8DDC8;
          --border-strong: #D6C4A3;
          --accent: #7A1F2D;
          --accent-soft: #F2D9DD;
          --card: #FDF8EF;
          --card-hover: #F5EAD0;
          --hl: #F2D9DD;
          --tts-bg: #F2D9DD;
          --paper: radial-gradient(ellipse at top, rgba(122,31,45,0.08), transparent 55%), radial-gradient(ellipse at 20% 80%, rgba(122,31,45,0.04), transparent 60%);
        }
        [data-theme="dark"] {
          --bg: #111113;
          --bg-soft: #18181B;
          --text: #E8E2DC;
          --text-muted: #A1A1AA;
          --text-faint: #71717A;
          --border: #27272A;
          --border-strong: #3F3F46;
          --accent: #D98B99;
          --accent-soft: #3A1E23;
          --card: #1C1C1F;
          --card-hover: #252529;
          --hl: #3A1E23;
          --tts-bg: #2A1E22;
          --paper: none;
        }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); }
        .font-serif-body { font-family: 'Lora', Georgia, serif; }
        .font-display { font-family: 'Fraunces', Georgia, serif; }
        .font-ui { font-family: 'Inter', system-ui, sans-serif; }
        .prose-content {
          font-family: 'Lora', Georgia, serif;
          font-size: var(--base-font);
          line-height: 1.85;
          color: var(--text);
          max-width: 72ch;
        }
        .prose-content p { margin: 1.15em 0; hanging-punctuation: first; }
        .prose-content p:first-of-type::first-letter {
          font-family: 'Fraunces', serif;
          float: left;
          font-size: 3.1em;
          line-height: 0.82;
          padding-right: 0.12em;
          padding-top: 0.06em;
          font-weight: 700;
          color: var(--accent);
          font-variation-settings: 'WONK' 1;
        }
        .cover .prose-content p:first-of-type::first-letter,
        .cover-first-letter-none p:first-of-type::first-letter { float: none; font-size: inherit; line-height: inherit; padding: 0; font-weight: inherit; color: inherit; }
        .prose-content .verse-ref {
          font-family: 'Fraunces', serif;
          font-style: italic;
          font-weight: 600;
          font-size: 0.86em;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--accent);
          border-left: 3px solid var(--border-strong);
          padding: 0.15em 0 0.15em 0.9em;
          margin: 2.2em 0 0.6em 0;
          display: block;
        }
        .prose-content .section-label {
          font-family: 'Inter', sans-serif;
          font-size: 0.72em;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          font-weight: 600;
          color: var(--text-muted);
          margin: 2.4em 0 0.8em 0;
          display: flex;
          align-items: center;
          gap: 0.6em;
        }
        .prose-content .section-label::before {
          content: '';
          width: 22px;
          height: 1px;
          background: var(--border-strong);
          display: inline-block;
        }
        .prose-content .section-label.life::after { content: ' ✦'; font-size: 0.9em; opacity: 0.5; letter-spacing: 0; }
        .prose-content .section-label.prayer::after { content: ' \uD83D\uDE4F'; font-size: 0.9em; opacity: 0.6; letter-spacing: 0; }
        .prose-content h1, .prose-content h2, .prose-content h3 { font-family: 'Fraunces', serif; }
        .prose-content hr {
          border: none;
          height: 1px;
          background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
          margin: 2.5em 0;
        }
        .search-hl { background: var(--hl); color: var(--text); padding: 0.1em 0.2em; border-radius: 3px; box-decoration-break: clone; }
        .tts-active {
          background: var(--tts-bg) !important;
          box-shadow: inset 3px 0 0 var(--accent);
          border-radius: 4px;
          padding-left: 0.6em !important;
          transition: background 0.3s ease;
        }
        .cover { text-align: center; padding: 3rem 1rem; }
        .cover .eyebrow { font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2.2rem; }
        .cover h1 { font-family: 'Fraunces', serif; font-size: 1.55rem; line-height: 1.28; letter-spacing: 0.02em; color: var(--text); max-width: 28ch; margin: 0 auto 2rem; font-weight: 700; }
        .cover .subtitle { font-family: 'Lora', serif; font-style: italic; font-size: 1.08rem; color: var(--text-muted); margin-bottom: 3rem; line-height: 1.6; max-width: 34ch; margin-left: auto; margin-right: auto; }
        .cover .author { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.1rem; margin-top: 1rem; }
        .cover .college { font-family: 'Inter', sans-serif; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); margin-top: 0.6rem; }
        .cover::after { content: '◆'; display: block; margin-top: 3rem; color: var(--border-strong); font-size: 0.7rem; letter-spacing: 0.5em; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::selection { background: var(--hl); }
